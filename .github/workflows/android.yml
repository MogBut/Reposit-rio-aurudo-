
name: Gerar APK Noturno

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair ZIP e localizar projeto
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: Arquivo settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corrigir dependência
        run: |
          sed -i '/dadb-android/d' "$PROJECT_DIR/app/build.gradle"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Noturno-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
