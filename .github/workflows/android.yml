
name: Gerar APK Noturno

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair ZIP
        run: unzip -q NoturnoApp-1.zip

      - name: Compilar APK
        run: gradle -p NoturnoApp assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Noturno-APK
          path: NoturnoApp/app/build/outputs/apk/debug/app-debug.apk
          
